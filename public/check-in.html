<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check-in Atleti - Busto Battle XI</title>
  <link rel="icon" type="image/jpeg" href="/LogoBB.jpeg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #f0f0f0;
      min-height: 100vh;
      padding: 1rem;
    }
    .container { max-width: 1400px; margin: 0 auto; }
    h1 { color: #F7AF40; margin-bottom: 1rem; text-align: center; font-size: 1.5rem; }
    
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .top-bar a {
      background: #333;
      color: #F7AF40;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      text-decoration: none;
    }
    
    .search-box {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .search-box input {
      flex: 1;
      padding: 0.6rem;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #fff;
      border-radius: 4px;
    }
    .search-box button {
      padding: 0.6rem 1.5rem;
      background: #F7AF40;
      color: #000;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    
    .stats-bar {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .stat { background: #1a1a1a; padding: 0.5rem 1rem; border-radius: 4px; }
    .stat span { color: #F7AF40; font-weight: bold; }
    
    /* Lista atleti - tabella compatta */
    .athletes-table {
      width: 100%;
      border-collapse: collapse;
      background: #1a1a1a;
      border-radius: 8px;
      overflow: hidden;
    }
    .athletes-table th, .athletes-table td {
      padding: 0.6rem;
      text-align: left;
      border-bottom: 1px solid #333;
    }
    .athletes-table th {
      background: #222;
      color: #F7AF40;
      font-size: 0.85rem;
    }
    .athletes-table tr:hover { background: #252525; }
    .athletes-table .btn-open {
      background: #F7AF40;
      color: #000;
      border: none;
      padding: 0.3rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.8rem;
    }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 3px;
      font-size: 0.75rem;
      font-weight: bold;
    }
    .badge-ok { background: #166534; color: #22c55e; }
    .badge-no { background: #7f1d1d; color: #ef4444; }
    .badge-wait { background: #78350f; color: #f59e0b; }
    
    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      overflow-y: auto;
      padding: 1rem;
    }
    .modal.active { display: flex; justify-content: center; align-items: flex-start; }
    .modal-box {
      background: #1a1a1a;
      border-radius: 8px;
      width: 100%;
      max-width: 700px;
      margin: 2rem 0;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      border-bottom: 1px solid #333;
      background: #222;
    }
    .modal-header h2 { color: #F7AF40; font-size: 1.2rem; }
    .modal-close {
      background: none;
      border: none;
      color: #888;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0.2rem 0.5rem;
    }
    .modal-close:hover { color: #fff; }
    .modal-body { padding: 1rem; }
    
    /* Sezioni scheda */
    .section {
      margin-bottom: 1rem;
      background: #111;
      border-radius: 6px;
      overflow: hidden;
    }
    .section-title {
      background: #222;
      padding: 0.5rem 0.8rem;
      font-weight: bold;
      color: #F7AF40;
      font-size: 0.9rem;
    }
    .section-content { padding: 0.8rem; }
    
    /* Info grid */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 0.5rem;
    }
    .info-item label {
      display: block;
      color: #666;
      font-size: 0.7rem;
      text-transform: uppercase;
    }
    .info-item span { color: #fff; font-size: 0.9rem; }
    
    /* Righe pagamento */
    .pay-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0;
      border-bottom: 1px solid #222;
    }
    .pay-row:last-child { border-bottom: none; }
    .pay-row .label { flex: 1; }
    .pay-row .price { color: #F7AF40; margin-right: 1rem; font-weight: bold; }
    .pay-row .status { min-width: 100px; text-align: right; }
    
    .btn-pay {
      padding: 0.3rem 0.8rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: bold;
    }
    .btn-pay.unpaid { background: #dc2626; color: #fff; }
    .btn-pay.paid { background: #16a34a; color: #fff; }
    
    /* Totale */
    .total-box {
      background: #166534;
      border: 2px solid #22c55e;
      border-radius: 6px;
      padding: 1rem;
      text-align: center;
      margin-bottom: 1rem;
    }
    .total-box .label { color: #a7f3d0; font-size: 0.9rem; }
    .total-box .amount { color: #fff; font-size: 1.8rem; font-weight: bold; }
    
    /* Footer modal */
    .modal-footer {
      padding: 1rem;
      border-top: 1px solid #333;
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
    }
    .btn-save {
      background: #22c55e;
      color: #000;
      border: none;
      padding: 0.8rem 2rem;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }
    .btn-save:hover { background: #16a34a; }
    .btn-cancel {
      background: #333;
      color: #fff;
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <a href="/admin.html">← Admin</a>
      <h1>🏁 Check-in Atleti</h1>
      <div></div>
    </div>
    
    <div class="search-box">
      <input type="text" id="search" placeholder="Cerca per nome, cognome o codice...">
      <button id="btn-search">🔍 Cerca</button>
    </div>
    
    <div class="stats-bar">
      <div class="stat">Totale: <span id="stat-total">0</span></div>
      <div class="stat">Check-in: <span id="stat-checkin">0</span></div>
      <div class="stat">In attesa: <span id="stat-pending">0</span></div>
    </div>
    
    <table class="athletes-table">
      <thead>
        <tr>
          <th>Codice</th>
          <th>Cognome</th>
          <th>Nome</th>
          <th>Discipline</th>
          <th>Prove</th>
          <th>Merch</th>
          <th>Stato</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="athletes-body"></tbody>
    </table>
  </div>
  
  <!-- Modal Scheda Atleta -->
  <div id="modal" class="modal">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modal-title">Scheda Atleta</h2>
        <button class="modal-close" id="btn-modal-close">×</button>
      </div>
      <div class="modal-body">
        <!-- Info Atleta -->
        <div class="section">
          <div class="section-title">👤 Dati Atleta</div>
          <div class="section-content">
            <div class="info-grid" id="athlete-info"></div>
          </div>
        </div>
        
        <!-- Discipline -->
        <div class="section">
          <div class="section-title">🏆 Discipline</div>
          <div class="section-content" id="athlete-disciplines"></div>
        </div>
        
        <!-- Iscrizione (se contanti) -->
        <div class="section" id="section-iscrizione" style="display:none">
          <div class="section-title">💳 Iscrizione</div>
          <div class="section-content">
            <div class="pay-row">
              <div class="label">Quota iscrizione</div>
              <div class="price" id="iscrizione-prezzo">€0</div>
              <div class="status">
                <button class="btn-pay" id="btn-iscrizione">Da pagare</button>
              </div>
            </div>
          </div>
        </div>
        
        <!-- Prove Pista -->
        <div class="section" id="section-prove">
          <div class="section-title">📅 Prove Pista</div>
          <div class="section-content" id="athlete-prove"></div>
        </div>
        
        <!-- Merchandising da iscrizione -->
        <div class="section" id="section-merch-isc">
          <div class="section-title">🛍️ Merch (da iscrizione)</div>
          <div class="section-content" id="athlete-merch-isc"></div>
        </div>
        
        <!-- Merchandising da ordini separati -->
        <div class="section" id="section-merch-ord">
          <div class="section-title">🛒 Merch (ordini separati)</div>
          <div class="section-content" id="athlete-merch-ord"></div>
        </div>
        
        <!-- Totale da pagare -->
        <div class="total-box">
          <div class="label">TOTALE DA PAGARE</div>
          <div class="amount" id="total-amount">€0</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="btn-annulla">Annulla</button>
        <button class="btn-save" id="btn-chiudi-checkin">✅ Check-in Fatto</button>
      </div>
    </div>
  </div>
  
  <script>
    let athletes = [];
    let currentAthlete = null;
    let pendingChanges = {};
    
    // Prezzi
    const PREZZI = {
      prova: 5,
      maglia: 15,
      felpa: 35,
      cappellino: 5,
      asciugamano: 5
    };
    
    async function loadAthletes() {
      try {
        const res = await fetch('/api/checkin', { credentials: 'include' });
        if (res.status === 401 || res.status === 403) {
          alert('Sessione scaduta. Effettua il login.');
          window.location.href = '/login.html';
          return;
        }
        athletes = await res.json();
        
        document.getElementById('stat-total').textContent = athletes.length;
        document.getElementById('stat-checkin').textContent = athletes.filter(a => a.checkin_fatto).length;
        document.getElementById('stat-pending').textContent = athletes.filter(a => !a.checkin_fatto).length;
        
        renderTable(athletes);
      } catch (err) {
        console.error(err);
        alert('Errore caricamento: ' + err.message);
      }
    }
    
    function renderTable(list) {
      const tbody = document.getElementById('athletes-body');
      tbody.innerHTML = list.map(a => {
        // Stato prove
        let proveStatus = '';
        if (a.num_prove > 0) {
          proveStatus = a.prove_pagato 
            ? '<span class="badge badge-ok">✓</span>' 
            : '<span class="badge badge-no">€</span>';
        }
        
        // Stato merch
        let merchStatus = '';
        if (a.num_merch > 0) {
          merchStatus = a.merch_pagato 
            ? '<span class="badge badge-ok">✓</span>' 
            : '<span class="badge badge-no">€</span>';
        }
        
        return `
        <tr>
          <td><code>${a.codice}</code></td>
          <td>${a.cognome}</td>
          <td>${a.nome}</td>
          <td>${a.num_discipline}</td>
          <td>${a.num_prove} ${proveStatus}</td>
          <td>${a.num_merch} ${merchStatus}</td>
          <td>
            ${a.checkin_fatto 
              ? '<span class="badge badge-ok">✓ Fatto</span>' 
              : '<span class="badge badge-wait">In attesa</span>'}
          </td>
          <td><button class="btn-open" data-id="${a.id}">Apri</button></td>
        </tr>
      `}).join('');
      
      // Aggiungi event listeners ai pulsanti
      tbody.querySelectorAll('.btn-open').forEach(btn => {
        btn.addEventListener('click', function() {
          const id = parseInt(this.getAttribute('data-id'));
          openAthlete(id);
        });
      });
    }
    
    function searchAthletes() {
      const q = document.getElementById('search').value.toLowerCase();
      const filtered = athletes.filter(a => 
        a.cognome.toLowerCase().includes(q) ||
        a.nome.toLowerCase().includes(q) ||
        a.codice.toLowerCase().includes(q)
      );
      renderTable(filtered);
    }
    
    function openAthlete(id) {
      currentAthlete = athletes.find(a => a.id === id);
      if (!currentAthlete) return;
      
      pendingChanges = {
        checkin_fatto: currentAthlete.checkin_fatto,
        prove_pagato: currentAthlete.prove_pagato,
        merch_pagato: currentAthlete.merch_pagato,
        iscrizione_pagato: currentAthlete.stato === 'confermata'
      };
      
      // Titolo
      document.getElementById('modal-title').textContent = 
        `${currentAthlete.cognome} ${currentAthlete.nome} - ${currentAthlete.codice}`;
      
      // Info
      document.getElementById('athlete-info').innerHTML = `
        <div class="info-item"><label>Società</label><span>${currentAthlete.societa || '-'}</span></div>
        <div class="info-item"><label>Nazionalità</label><span>${currentAthlete.nazionalita || '-'}</span></div>
        <div class="info-item"><label>Data nascita</label><span>${currentAthlete.datanascita || '-'}</span></div>
        <div class="info-item"><label>Metodo pag.</label><span>${currentAthlete.metodo_pagamento || '-'}</span></div>
      `;
      
      // Discipline
      document.getElementById('athlete-disciplines').innerHTML = currentAthlete.disciplines.length 
        ? currentAthlete.disciplines.map(d => `<span class="badge badge-ok">${d.nome} (${d.categoria})</span> `).join('')
        : '<span style="color:#666">Nessuna disciplina</span>';
      
      // Sezione Iscrizione (solo se contanti)
      const isContanti = currentAthlete.metodo_pagamento === 'contanti';
      const sectionIscr = document.getElementById('section-iscrizione');
      if (isContanti) {
        sectionIscr.style.display = 'block';
        document.getElementById('iscrizione-prezzo').textContent = '€' + (currentAthlete.totale_iscrizione || 0);
        updateIscrizioneBtn();
      } else {
        sectionIscr.style.display = 'none';
      }
      
      // Prove pista
      const proveDiv = document.getElementById('athlete-prove');
      if (currentAthlete.prove.length === 0) {
        proveDiv.innerHTML = '<span style="color:#666">Nessuna prova prenotata</span>';
        document.getElementById('section-prove').style.display = 'none';
      } else {
        document.getElementById('section-prove').style.display = 'block';
        proveDiv.innerHTML = currentAthlete.prove.map((p, i) => {
          const origineLabel = p.origine === 'iscrizione' ? '📋' : '🎫';
          return `
          <div class="pay-row">
            <div class="label">
              ${origineLabel} ${p.giorno_nome} ${p.ora} - ${p.specialita || 'Prova'}
              ${p.codice ? `<small style="color:#666">(${p.codice})</small>` : ''}
            </div>
            <div class="price">€${PREZZI.prova}</div>
            <div class="status">
              <button class="btn-pay btn-prova ${p.pagato ? 'paid' : 'unpaid'}" data-idx="${i}">
                ${p.pagato ? '✓ Pagato' : 'Da pagare'}
              </button>
            </div>
          </div>
        `}).join('');
        
        // Event listeners per prove
        proveDiv.querySelectorAll('.btn-prova').forEach(btn => {
          btn.addEventListener('click', function() {
            toggleProva(parseInt(this.dataset.idx), this);
          });
        });
      }
      
      // Merchandising da iscrizione
      const merchIsc = currentAthlete.merch.filter(m => m.origine === 'iscrizione');
      const merchIscDiv = document.getElementById('athlete-merch-isc');
      if (merchIsc.length === 0) {
        merchIscDiv.innerHTML = '<span style="color:#666">Nessun articolo</span>';
        document.getElementById('section-merch-isc').style.display = 'none';
      } else {
        document.getElementById('section-merch-isc').style.display = 'block';
        merchIscDiv.innerHTML = merchIsc.map((m, i) => {
          const prezzo = getPrezzo(m.articolo);
          const globalIdx = currentAthlete.merch.indexOf(m);
          return `
          <div class="pay-row">
            <div class="label">${m.articolo}${m.taglia ? ' - ' + m.taglia : ''}</div>
            <div class="price">€${prezzo}</div>
            <div class="status">
              <button class="btn-pay btn-merch ${m.pagato ? 'paid' : 'unpaid'}" data-idx="${globalIdx}">
                ${m.pagato ? '✓ Pagato' : 'Da pagare'}
              </button>
            </div>
          </div>
        `}).join('');
      }
      
      // Merchandising da ordini separati
      const merchOrd = currentAthlete.merch.filter(m => m.origine === 'ordine');
      const merchOrdDiv = document.getElementById('athlete-merch-ord');
      if (merchOrd.length === 0) {
        merchOrdDiv.innerHTML = '<span style="color:#666">Nessun ordine separato</span>';
        document.getElementById('section-merch-ord').style.display = 'none';
      } else {
        document.getElementById('section-merch-ord').style.display = 'block';
        merchOrdDiv.innerHTML = merchOrd.map((m, i) => {
          const prezzo = getPrezzo(m.articolo);
          const globalIdx = currentAthlete.merch.indexOf(m);
          return `
          <div class="pay-row">
            <div class="label">${m.articolo}${m.taglia ? ' - ' + m.taglia : ''} <small style="color:#888">(${m.codice_ordine || 'ord'})</small></div>
            <div class="price">€${prezzo}</div>
            <div class="status">
              <button class="btn-pay btn-merch ${m.pagato ? 'paid' : 'unpaid'}" data-idx="${globalIdx}">
                ${m.pagato ? '✓ Pagato' : 'Da pagare'}
              </button>
            </div>
          </div>
        `}).join('');
      }
      
      // Event listeners per tutti i merch
      document.querySelectorAll('.btn-merch').forEach(btn => {
        btn.addEventListener('click', function() {
          toggleMerch(parseInt(this.dataset.idx), this);
        });
      });
      
      updateTotal();
      document.getElementById('modal').classList.add('active');
    }
    
    function getPrezzo(articolo) {
      const a = articolo.toLowerCase();
      if (a.includes('felpa')) return PREZZI.felpa;
      if (a.includes('maglia')) return PREZZI.maglia;
      if (a.includes('cappellino')) return PREZZI.cappellino;
      if (a.includes('asciugamano')) return PREZZI.asciugamano;
      return 0;
    }
    
    function toggleIscrizione() {
      pendingChanges.iscrizione_pagato = !pendingChanges.iscrizione_pagato;
      updateIscrizioneBtn();
      updateTotal();
    }
    
    function updateIscrizioneBtn() {
      const btn = document.getElementById('btn-iscrizione');
      if (pendingChanges.iscrizione_pagato) {
        btn.className = 'btn-pay paid';
        btn.textContent = '✓ Pagato';
      } else {
        btn.className = 'btn-pay unpaid';
        btn.textContent = 'Da pagare';
      }
    }
    
    function toggleProva(idx, btn) {
      currentAthlete.prove[idx].pagato = !currentAthlete.prove[idx].pagato;
      if (currentAthlete.prove[idx].pagato) {
        btn.className = 'btn-pay btn-prova paid';
        btn.textContent = '✓ Pagato';
      } else {
        btn.className = 'btn-pay btn-prova unpaid';
        btn.textContent = 'Da pagare';
      }
      pendingChanges.prove_pagato = currentAthlete.prove.every(p => p.pagato);
      updateTotal();
    }
    
    function toggleMerch(idx, btn) {
      currentAthlete.merch[idx].pagato = !currentAthlete.merch[idx].pagato;
      if (currentAthlete.merch[idx].pagato) {
        btn.className = 'btn-pay btn-merch paid';
        btn.textContent = '✓ Pagato';
      } else {
        btn.className = 'btn-pay btn-merch unpaid';
        btn.textContent = 'Da pagare';
      }
      pendingChanges.merch_pagato = currentAthlete.merch.every(m => m.pagato);
      updateTotal();
    }
    
    function updateTotal() {
      let total = 0;
      
      // Iscrizione (solo se contanti e non pagato)
      const isContanti = currentAthlete.metodo_pagamento === 'contanti';
      if (isContanti && !pendingChanges.iscrizione_pagato) {
        total += currentAthlete.totale_iscrizione || 0;
      }
      
      // Prove non pagate
      currentAthlete.prove.forEach(p => {
        if (!p.pagato) total += PREZZI.prova;
      });
      
      // Merch non pagato
      currentAthlete.merch.forEach(m => {
        if (!m.pagato) total += getPrezzo(m.articolo);
      });
      
      document.getElementById('total-amount').textContent = '€' + total;
    }
    
    function closeModal() {
      document.getElementById('modal').classList.remove('active');
      currentAthlete = null;
      pendingChanges = {};
    }
    
    async function saveAndClose() {
      if (!currentAthlete) {
        alert('Errore: nessun atleta selezionato');
        return;
      }
      
      const athleteId = currentAthlete.id;
      const metodoPagamento = currentAthlete.metodo_pagamento || '';
      
      try {
        // Salva check-in fatto
        await fetch('/api/checkin/update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            athleteId: athleteId,
            field: 'checkin_fatto',
            value: true
          })
        });
        
        // Salva prove pagato
        await fetch('/api/checkin/update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            athleteId: athleteId,
            field: 'prove_pagato',
            value: pendingChanges.prove_pagato || false
          })
        });
        
        // Salva merch pagato
        await fetch('/api/checkin/update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            athleteId: athleteId,
            field: 'merch_pagato',
            value: pendingChanges.merch_pagato || false
          })
        });
        
        // Se contanti e pagato, conferma iscrizione
        if (metodoPagamento === 'contanti' && pendingChanges.iscrizione_pagato) {
          await fetch('/api/checkin/update', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({
              athleteId: athleteId,
              field: 'iscrizione_pagato',
              value: true
            })
          });
        }
        
        closeModal();
        await loadAthletes();
      } catch (err) {
        console.error(err);
        alert('Errore salvataggio: ' + err.message);
      }
    }
    
    // Click esterno chiude modal
    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target.id === 'modal') closeModal();
    });
    
    // Pulsante X chiude modal
    document.getElementById('btn-modal-close').addEventListener('click', closeModal);
    
    // Pulsante Annulla
    document.getElementById('btn-annulla').addEventListener('click', closeModal);
    
    // Pulsante Chiudi Check-in
    document.getElementById('btn-chiudi-checkin').addEventListener('click', saveAndClose);
    
    // Pulsante Iscrizione
    document.getElementById('btn-iscrizione').addEventListener('click', toggleIscrizione);
    
    // Pulsante Cerca
    document.getElementById('btn-search').addEventListener('click', searchAthletes);
    
    // Enter nella ricerca
    document.getElementById('search').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchAthletes();
    });
    
    // Avvio
    loadAthletes();
  </script>
</body>
</html>
