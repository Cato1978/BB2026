<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carica Ricevuta Prove Pista - Gara Template</title>
  <link rel="icon" href="/favicon.ico">
  <script src="/config-loader.js"></script>
  <style>
    :root { --primary-color: #F7AF40; --secondary-color: #22C55E; --bg-dark: #111; --text-light: #f0f0f0; --error-color: #EF4444; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-dark); color: var(--text-light); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem; }
    
    .container { background: #1a1a1a; padding: 2rem; border-radius: 12px; border: 1px solid #333; max-width: 500px; width: 100%; }
    h1 { color: var(--primary-color); text-align: center; margin-bottom: 0.5rem; }
    .subtitle { text-align: center; color: #888; margin-bottom: 2rem; }
    
    .form-group { margin-bottom: 1.5rem; }
    label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: #ccc; }
    input[type="text"], input[type="file"] { width: 100%; padding: 0.8rem; border: 1px solid #444; border-radius: 6px; background: #222; color: var(--text-light); font-size: 1rem; }
    input[type="file"] { padding: 0.5rem; }
    
    .btn { padding: 1rem 2rem; font-size: 1rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; width: 100%; background: var(--primary-color); color: #000; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .alert { padding: 1rem; border-radius: 8px; margin-bottom: 1rem; text-align: center; }
    .alert-success { background: rgba(34, 197, 94, 0.2); border: 1px solid var(--secondary-color); color: var(--secondary-color); }
    .alert-error { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--error-color); color: var(--error-color); }
    
    .back-link { display: block; text-align: center; margin-top: 1.5rem; color: #888; text-decoration: none; }
    .back-link:hover { color: var(--primary-color); }
  </style>
</head>
<body>

<div class="container">
  <h1>📄 Carica Ricevuta Prove Pista</h1>
  <p class="subtitle">Carica la ricevuta del bonifico per confermare la prenotazione</p>
  
  <div id="alert-container"></div>
  
  <form id="upload-form">
    <div class="form-group">
      <label>Codice Prenotazione *</label>
      <input type="text" id="codice" name="codice" placeholder="Es: PRV-ABC123" required>
    </div>
    <div class="form-group">
      <label>Ricevuta Bonifico (PDF) *</label>
      <input type="file" id="ricevuta" name="ricevuta" accept=".pdf" required>
    </div>
    <button type="submit" class="btn">Carica Ricevuta</button>
  </form>
  
  <a href="/" class="back-link">← Torna al sito</a>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const codice = urlParams.get('codice');
if (codice) {
  document.getElementById('codice').value = codice;
}

document.addEventListener('configLoaded', () => {
  const cfg = window.GARA_CONFIG;
  document.title = `Carica Ricevuta Prove - ${cfg.event.fullName}`;
});

document.getElementById('upload-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const codice = document.getElementById('codice').value;
  const file = document.getElementById('ricevuta').files[0];
  
  if (!file) {
    showAlert('error', 'Seleziona un file PDF');
    return;
  }
  
  const formData = new FormData();
  formData.append('ricevuta', file);
  
  const btn = e.target.querySelector('button');
  btn.disabled = true;
  btn.textContent = 'Caricamento...';
  
  try {
    const res = await fetch(`/api/prove/prenotazioni/${codice}/ricevuta`, {
      method: 'POST',
      body: formData
    });
    
    const result = await res.json();
    
    if (res.ok) {
      showAlert('success', 'Ricevuta caricata con successo! La prenotazione è ora in verifica.');
      e.target.reset();
    } else {
      showAlert('error', result.error || 'Errore durante il caricamento');
    }
  } catch (err) {
    showAlert('error', 'Errore di connessione');
  }
  
  btn.disabled = false;
  btn.textContent = 'Carica Ricevuta';
});

function showAlert(type, message) {
  document.getElementById('alert-container').innerHTML = `
    <div class="alert alert-${type}">${message}</div>
  `;
}
</script>

</body>
</html>
