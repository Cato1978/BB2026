<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programma - Gara Template</title>
  <link rel="icon" href="/favicon.ico">
  <script src="/config-loader.js"></script>
  <script src="/translations-template.js"></script>
  <style>
    :root { --primary-color: #F7AF40; --secondary-color: #22C55E; --bg-dark: #111; --text-light: #f0f0f0; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-dark); color: var(--text-light); min-height: 100vh; }
    
    header { display: flex; align-items: center; padding: 1rem 2rem; border-bottom: 2px solid var(--primary-color); background: #000; flex-wrap: wrap; gap: 1rem; }
    .logo-title { display: flex; align-items: center; gap: 1rem; }
    .logo-title img { height: 50px; }
    .logo-title h1 { font-size: 1.3rem; color: var(--primary-color); }
    .lang-switcher { display: flex; gap: 0.5rem; }
    .lang-btn { background: transparent; border: 1px solid var(--primary-color); color: var(--text-light); padding: 0.3rem 0.6rem; cursor: pointer; }
    .lang-btn.active { background: var(--primary-color); color: #000; }
    nav { margin-left: auto; display: flex; gap: 1.5rem; flex-wrap: wrap; }
    nav a { color: var(--text-light); text-decoration: none; }
    nav a:hover { color: var(--primary-color); }
    
    main { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    h2 { color: var(--primary-color); margin-bottom: 0.5rem; font-size: 2rem; text-align: center; }
    .subtitle { text-align: center; color: #888; margin-bottom: 2rem; }
    
    .schedule-day { background: #1a1a1a; border-radius: 12px; margin-bottom: 1.5rem; overflow: hidden; border: 1px solid #333; }
    .day-header { background: linear-gradient(135deg, var(--primary-color), #d4940a); padding: 1rem 1.5rem; }
    .day-header h3 { color: #000; font-size: 1.3rem; margin: 0; }
    .day-header .date { color: rgba(0,0,0,0.7); font-size: 0.9rem; }
    
    .day-events { padding: 1rem 1.5rem; }
    .event-item { display: flex; gap: 1rem; padding: 0.8rem 0; border-bottom: 1px solid #333; align-items: flex-start; }
    .event-item:last-child { border-bottom: none; }
    .event-time { background: #333; padding: 0.4rem 0.8rem; border-radius: 6px; font-weight: bold; white-space: nowrap; min-width: 100px; text-align: center; }
    .event-activity { flex: 1; }
    .event-activity .title { font-weight: 500; }
    .event-activity .details { color: #888; font-size: 0.9rem; margin-top: 0.3rem; }
    
    .legend { background: #1a1a1a; padding: 1.5rem; border-radius: 12px; margin-top: 2rem; border: 1px solid #333; }
    .legend h4 { color: var(--primary-color); margin-bottom: 1rem; }
    .legend-item { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
    .legend-color { width: 20px; height: 20px; border-radius: 4px; }
    
    @media (max-width: 768px) {
      header { flex-direction: column; }
      nav { margin-left: 0; justify-content: center; }
      .event-item { flex-direction: column; }
      .event-time { min-width: auto; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo-title">
    <img src="/logo.png" alt="Logo">
    <h1 data-config="event.fullName">Gara Template</h1>
  </div>
  <div class="lang-switcher">
    <button class="lang-btn active" data-lang="it" onclick="setLang('it')">IT</button>
    <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
  </div>
  <nav>
    <a href="/" data-t="nav_home">Home</a>
    <a href="/iscrizioni.html" data-t="nav_registration">Iscrizioni</a>
    <a href="/hotel.html" data-t="nav_hotel">Hotel</a>
    <a href="/travel.html" data-t="nav_travel">Come Arrivare</a>
    <a href="/contact.html" data-t="nav_contact">Contatti</a>
  </nav>
</header>

<main>
  <h2 data-t="program_title">Programma</h2>
  <p class="subtitle" data-t="program_subtitle">Calendario completo della gara</p>
  
  <div id="schedule-container">
    <p style="text-align:center;color:#888;">Caricamento programma...</p>
  </div>
  
  <div class="legend">
    <h4>📍 Location</h4>
    <p id="venue-info">Caricamento...</p>
    <p id="venue-address" style="color:#888;margin-top:0.5rem;"></p>
    <a id="venue-maps" href="#" target="_blank" style="color:var(--primary-color);display:inline-block;margin-top:0.5rem;">📍 Apri in Google Maps</a>
  </div>
</main>

<script>
document.addEventListener('configLoaded', () => {
  const cfg = window.GARA_CONFIG;
  document.title = `Programma - ${cfg.event.fullName}`;
  
  // Popola programma
  const container = document.getElementById('schedule-container');
  if (!cfg.schedule || !cfg.schedule.days.length) {
    container.innerHTML = '<p style="text-align:center;color:#888;">Programma non ancora disponibile</p>';
    return;
  }
  
  container.innerHTML = cfg.schedule.days.map(day => {
    const date = new Date(day.date);
    const dateFormatted = date.toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' });
    
    return `
      <div class="schedule-day">
        <div class="day-header">
          <h3>${day.name}</h3>
          <span class="date">${dateFormatted}</span>
        </div>
        <div class="day-events">
          ${day.events.map(ev => `
            <div class="event-item">
              <div class="event-time">${ev.time}</div>
              <div class="event-activity">
                <div class="title">${ev.activity}</div>
                ${ev.details ? `<div class="details">${ev.details}</div>` : ''}
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');
  
  // Location info
  const loc = cfg.event.location;
  document.getElementById('venue-info').textContent = `${loc.venue} - ${loc.city}`;
  document.getElementById('venue-address').textContent = loc.address;
  document.getElementById('venue-maps').href = loc.maps_url || '#';
});
</script>

</body>
</html>
