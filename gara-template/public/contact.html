<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contatti - Gara Template</title>
  <link rel="icon" href="/favicon.ico">
  <script src="/config-loader.js"></script>
  <script src="/translations-template.js"></script>
  <style>
    :root { --primary-color: #F7AF40; --secondary-color: #22C55E; --bg-dark: #111; --text-light: #f0f0f0; --error-color: #EF4444; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-dark); color: var(--text-light); min-height: 100vh; }
    
    header { display: flex; align-items: center; padding: 1rem 2rem; border-bottom: 2px solid var(--primary-color); background: #000; flex-wrap: wrap; gap: 1rem; }
    .logo-title { display: flex; align-items: center; gap: 1rem; }
    .logo-title img { height: 50px; }
    .logo-title h1 { font-size: 1.3rem; color: var(--primary-color); }
    .lang-switcher { display: flex; gap: 0.5rem; }
    .lang-btn { background: transparent; border: 1px solid var(--primary-color); color: var(--text-light); padding: 0.3rem 0.6rem; cursor: pointer; }
    .lang-btn.active { background: var(--primary-color); color: #000; }
    nav { margin-left: auto; display: flex; gap: 1.5rem; flex-wrap: wrap; }
    nav a { color: var(--text-light); text-decoration: none; }
    nav a:hover { color: var(--primary-color); }
    
    main { max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
    h2 { color: var(--primary-color); margin-bottom: 0.5rem; font-size: 2rem; text-align: center; }
    .subtitle { text-align: center; color: #888; margin-bottom: 2rem; }
    
    .contact-form { background: #1a1a1a; padding: 2rem; border-radius: 12px; border: 1px solid #333; }
    .form-group { margin-bottom: 1.5rem; }
    label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: #ccc; }
    input, textarea { width: 100%; padding: 0.8rem; border: 1px solid #444; border-radius: 6px; background: #222; color: var(--text-light); font-size: 1rem; }
    input:focus, textarea:focus { outline: none; border-color: var(--primary-color); }
    textarea { resize: vertical; min-height: 150px; }
    
    .btn { padding: 1rem 2rem; font-size: 1.1rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; width: 100%; }
    .btn-primary { background: var(--primary-color); color: #000; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .alert { padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
    .alert-success { background: rgba(34, 197, 94, 0.2); border: 1px solid var(--secondary-color); color: var(--secondary-color); }
    .alert-error { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--error-color); color: var(--error-color); }
    
    .contact-info { margin-top: 2rem; background: #1a1a1a; padding: 1.5rem; border-radius: 12px; border: 1px solid #333; }
    .contact-info h3 { color: var(--primary-color); margin-bottom: 1rem; }
    .contact-info-item { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.8rem; }
    .contact-info-item a { color: var(--primary-color); text-decoration: none; }
    
    .social-links { display: flex; gap: 1rem; margin-top: 1rem; }
    .social-links a { display: flex; align-items: center; gap: 0.5rem; color: var(--text-light); text-decoration: none; padding: 0.5rem 1rem; background: #333; border-radius: 6px; }
    .social-links a:hover { background: #444; }
    
    @media (max-width: 768px) {
      header { flex-direction: column; }
      nav { margin-left: 0; justify-content: center; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo-title">
    <img src="/logo.png" alt="Logo">
    <h1 data-config="event.fullName">Gara Template</h1>
  </div>
  <div class="lang-switcher">
    <button class="lang-btn active" data-lang="it" onclick="setLang('it')">IT</button>
    <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
  </div>
  <nav>
    <a href="/" data-t="nav_home">Home</a>
    <a href="/iscrizioni.html" data-t="nav_registration">Iscrizioni</a>
    <a href="/programma.html" data-t="nav_program">Programma</a>
    <a href="/hotel.html" data-t="nav_hotel">Hotel</a>
  </nav>
</header>

<main>
  <h2 data-t="contact_title">Contattaci</h2>
  <p class="subtitle" data-t="contact_subtitle">Hai domande? Scrivici!</p>
  
  <div id="alert-container"></div>
  
  <form class="contact-form" id="contact-form">
    <div class="form-group">
      <label data-t="form_name">Nome *</label>
      <input type="text" id="nome" name="nome" required>
    </div>
    <div class="form-group">
      <label data-t="form_email">Email *</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div class="form-group">
      <label data-t="contact_subject">Oggetto *</label>
      <input type="text" id="oggetto" name="oggetto" required>
    </div>
    <div class="form-group">
      <label data-t="contact_message">Messaggio *</label>
      <textarea id="messaggio" name="messaggio" required></textarea>
    </div>
    <button type="submit" class="btn btn-primary" data-t="contact_send">Invia</button>
  </form>
  
  <div class="contact-info">
    <h3>📬 Contatti Diretti</h3>
    <div class="contact-info-item">
      <span>📧</span>
      <a href="#" id="contact-email">Caricamento...</a>
    </div>
    <div class="social-links" id="social-container">
      <!-- Popolato da JS -->
    </div>
  </div>
</main>

<script>
document.addEventListener('configLoaded', () => {
  const cfg = window.GARA_CONFIG;
  document.title = `Contatti - ${cfg.event.fullName}`;
  
  // Email contatto
  const email = cfg.branding?.contact_email || 'info@example.com';
  const emailEl = document.getElementById('contact-email');
  emailEl.href = `mailto:${email}`;
  emailEl.textContent = email;
  
  // Social links
  const socialContainer = document.getElementById('social-container');
  let socialHtml = '';
  if (cfg.social?.facebook) socialHtml += `<a href="${cfg.social.facebook}" target="_blank">📘 Facebook</a>`;
  if (cfg.social?.instagram) socialHtml += `<a href="${cfg.social.instagram}" target="_blank">📷 Instagram</a>`;
  if (cfg.social?.youtube) socialHtml += `<a href="${cfg.social.youtube}" target="_blank">📺 YouTube</a>`;
  socialContainer.innerHTML = socialHtml || '<span style="color:#888;">Nessun social configurato</span>';
});

document.getElementById('contact-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const formData = new FormData(e.target);
  const data = Object.fromEntries(formData.entries());
  
  const btn = e.target.querySelector('button');
  btn.disabled = true;
  btn.textContent = 'Invio...';
  
  try {
    const res = await fetch('/api/contatti', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    
    if (res.ok) {
      document.getElementById('alert-container').innerHTML = 
        '<div class="alert alert-success">Messaggio inviato con successo! Ti risponderemo al più presto.</div>';
      e.target.reset();
    } else {
      const err = await res.json();
      document.getElementById('alert-container').innerHTML = 
        `<div class="alert alert-error">${err.error || 'Errore durante l\'invio'}</div>`;
    }
  } catch (err) {
    document.getElementById('alert-container').innerHTML = 
      '<div class="alert alert-error">Errore di connessione</div>';
  }
  
  btn.disabled = false;
  btn.textContent = 'Invia';
});
</script>

</body>
</html>
