<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifica Iscrizione - Gara Template</title>
  <link rel="icon" href="/favicon.ico">
  <script src="/config-loader.js"></script>
  <script src="/translations-template.js"></script>
  <style>
    :root { --primary-color: #F7AF40; --secondary-color: #22C55E; --bg-dark: #111; --text-light: #f0f0f0; --error-color: #EF4444; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-dark); color: var(--text-light); min-height: 100vh; }
    
    header { display: flex; align-items: center; padding: 1rem 2rem; border-bottom: 2px solid var(--primary-color); background: #000; flex-wrap: wrap; gap: 1rem; }
    .logo-title { display: flex; align-items: center; gap: 1rem; }
    .logo-title img { height: 50px; }
    .logo-title h1 { font-size: 1.3rem; color: var(--primary-color); }
    nav { margin-left: auto; display: flex; gap: 1.5rem; flex-wrap: wrap; }
    nav a { color: var(--text-light); text-decoration: none; }
    nav a:hover { color: var(--primary-color); }
    
    main { max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
    h2 { color: var(--primary-color); margin-bottom: 0.5rem; font-size: 2rem; text-align: center; }
    .subtitle { text-align: center; color: #888; margin-bottom: 2rem; }
    
    .search-form { background: #1a1a1a; padding: 2rem; border-radius: 12px; border: 1px solid #333; margin-bottom: 2rem; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: #ccc; }
    input { width: 100%; padding: 0.8rem; border: 1px solid #444; border-radius: 6px; background: #222; color: var(--text-light); font-size: 1rem; }
    input:focus { outline: none; border-color: var(--primary-color); }
    
    .btn { padding: 1rem 2rem; font-size: 1rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; width: 100%; }
    .btn-primary { background: var(--primary-color); color: #000; }
    
    .result-card { background: #1a1a1a; padding: 1.5rem; border-radius: 12px; border: 1px solid #333; margin-bottom: 1rem; }
    .result-card h3 { color: var(--primary-color); margin-bottom: 1rem; }
    .result-row { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #333; }
    .result-row:last-child { border-bottom: none; }
    .result-row .label { color: #888; }
    
    .status-badge { display: inline-block; padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.9rem; font-weight: bold; }
    .status-confermata { background: var(--secondary-color); color: #000; }
    .status-sospesa { background: var(--primary-color); color: #000; }
    .status-verifica { background: #3B82F6; color: #fff; }
    .status-annullata { background: var(--error-color); color: #fff; }
    
    .no-results { text-align: center; padding: 2rem; color: #888; }
    
    @media (max-width: 768px) {
      header { flex-direction: column; }
      nav { margin-left: 0; justify-content: center; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo-title">
    <img src="/logo.png" alt="Logo">
    <h1 data-config="event.fullName">Gara Template</h1>
  </div>
  <nav>
    <a href="/" data-t="nav_home">Home</a>
    <a href="/iscrizioni.html" data-t="nav_registration">Iscrizioni</a>
    <a href="/programma.html" data-t="nav_program">Programma</a>
    <a href="/contact.html" data-t="nav_contact">Contatti</a>
  </nav>
</header>

<main>
  <h2>Verifica Iscrizione</h2>
  <p class="subtitle">Cerca la tua iscrizione per cognome</p>
  
  <form class="search-form" id="search-form">
    <div class="form-group">
      <label>Cognome</label>
      <input type="text" id="cognome" name="cognome" placeholder="Inserisci il tuo cognome" required>
    </div>
    <button type="submit" class="btn btn-primary">🔍 Cerca</button>
  </form>
  
  <div id="results-container"></div>
</main>

<script>
document.addEventListener('configLoaded', () => {
  const cfg = window.GARA_CONFIG;
  document.title = `Verifica Iscrizione - ${cfg.event.fullName}`;
});

document.getElementById('search-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const cognome = document.getElementById('cognome').value.trim();
  if (!cognome) return;
  
  const container = document.getElementById('results-container');
  container.innerHTML = '<p style="text-align:center;color:#888;">Ricerca in corso...</p>';
  
  try {
    const res = await fetch(`/api/iscritti/cerca?cognome=${encodeURIComponent(cognome)}`);
    const data = await res.json();
    
    if (!data.length) {
      container.innerHTML = '<div class="no-results">Nessuna iscrizione trovata con questo cognome</div>';
      return;
    }
    
    container.innerHTML = data.map(i => `
      <div class="result-card">
        <h3>${i.cognome} ${i.nome}</h3>
        <div class="result-row">
          <span class="label">Codice</span>
          <span>${i.codice || 'N/D'}</span>
        </div>
        <div class="result-row">
          <span class="label">Discipline</span>
          <span>${i.categoria || 'N/D'}</span>
        </div>
        <div class="result-row">
          <span class="label">Società</span>
          <span>${i.societa || 'N/D'}</span>
        </div>
        <div class="result-row">
          <span class="label">Stato</span>
          <span class="status-badge status-${i.stato || 'sospesa'}">${i.stato || 'sospesa'}</span>
        </div>
      </div>
    `).join('');
    
  } catch (err) {
    container.innerHTML = '<div class="no-results">Errore durante la ricerca</div>';
  }
});
</script>

</body>
</html>
