<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel - Gara Template</title>
  <link rel="icon" href="/favicon.ico">
  <script src="/config-loader.js"></script>
  <script src="/translations-template.js"></script>
  <style>
    :root { --primary-color: #F7AF40; --secondary-color: #22C55E; --bg-dark: #111; --text-light: #f0f0f0; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-dark); color: var(--text-light); min-height: 100vh; }
    
    header { display: flex; align-items: center; padding: 1rem 2rem; border-bottom: 2px solid var(--primary-color); background: #000; flex-wrap: wrap; gap: 1rem; }
    .logo-title { display: flex; align-items: center; gap: 1rem; }
    .logo-title img { height: 50px; }
    .logo-title h1 { font-size: 1.3rem; color: var(--primary-color); }
    .lang-switcher { display: flex; gap: 0.5rem; }
    .lang-btn { background: transparent; border: 1px solid var(--primary-color); color: var(--text-light); padding: 0.3rem 0.6rem; cursor: pointer; }
    .lang-btn.active { background: var(--primary-color); color: #000; }
    nav { margin-left: auto; display: flex; gap: 1.5rem; flex-wrap: wrap; }
    nav a { color: var(--text-light); text-decoration: none; }
    nav a:hover { color: var(--primary-color); }
    
    main { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
    h2 { color: var(--primary-color); margin-bottom: 0.5rem; font-size: 2rem; text-align: center; }
    .subtitle { text-align: center; color: #888; margin-bottom: 2rem; }
    
    .hotels-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
    
    .hotel-card { background: #1a1a1a; border-radius: 12px; overflow: hidden; border: 1px solid #333; transition: transform 0.2s, border-color 0.2s; }
    .hotel-card:hover { transform: translateY(-4px); border-color: var(--primary-color); }
    
    .hotel-header { background: linear-gradient(135deg, #222, #333); padding: 1.5rem; }
    .hotel-header h3 { margin: 0 0 0.5rem 0; font-size: 1.3rem; }
    .hotel-stars { color: var(--primary-color); }
    
    .hotel-body { padding: 1.5rem; }
    .hotel-info { margin-bottom: 0.8rem; display: flex; align-items: flex-start; gap: 0.5rem; }
    .hotel-info .icon { flex-shrink: 0; }
    .hotel-info a { color: var(--primary-color); text-decoration: none; }
    .hotel-info a:hover { text-decoration: underline; }
    
    .discount-badge { background: linear-gradient(135deg, var(--secondary-color), #16a34a); color: #000; padding: 1rem; margin-top: 1rem; border-radius: 8px; text-align: center; }
    .discount-badge .code { font-size: 1.2rem; font-weight: bold; letter-spacing: 2px; }
    .discount-badge .percent { font-size: 0.9rem; margin-top: 0.3rem; }
    
    .no-hotels { text-align: center; padding: 3rem; color: #888; }
    
    @media (max-width: 768px) {
      header { flex-direction: column; }
      nav { margin-left: 0; justify-content: center; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo-title">
    <img src="/logo.png" alt="Logo">
    <h1 data-config="event.fullName">Gara Template</h1>
  </div>
  <div class="lang-switcher">
    <button class="lang-btn active" data-lang="it" onclick="setLang('it')">IT</button>
    <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
  </div>
  <nav>
    <a href="/" data-t="nav_home">Home</a>
    <a href="/iscrizioni.html" data-t="nav_registration">Iscrizioni</a>
    <a href="/programma.html" data-t="nav_program">Programma</a>
    <a href="/travel.html" data-t="nav_travel">Come Arrivare</a>
    <a href="/contact.html" data-t="nav_contact">Contatti</a>
  </nav>
</header>

<main>
  <h2 data-t="hotel_title">Hotel Convenzionati</h2>
  <p class="subtitle" data-t="hotel_subtitle">Strutture con tariffe speciali per i partecipanti</p>
  
  <div class="hotels-grid" id="hotels-container">
    <p class="no-hotels">Caricamento hotel...</p>
  </div>
</main>

<script>
document.addEventListener('configLoaded', () => {
  const cfg = window.GARA_CONFIG;
  document.title = `Hotel - ${cfg.event.fullName}`;
  
  const container = document.getElementById('hotels-container');
  
  if (!cfg.hotels || !cfg.hotels.length) {
    container.innerHTML = '<p class="no-hotels">Nessun hotel convenzionato al momento. Controlla più tardi!</p>';
    return;
  }
  
  container.innerHTML = cfg.hotels.map(h => `
    <div class="hotel-card">
      <div class="hotel-header">
        <h3>${h.name}</h3>
        <span class="hotel-stars">${'⭐'.repeat(h.stars)}</span>
      </div>
      <div class="hotel-body">
        <div class="hotel-info">
          <span class="icon">📍</span>
          <span>${h.address}</span>
        </div>
        <div class="hotel-info">
          <span class="icon">📞</span>
          <a href="tel:${h.phone}">${h.phone}</a>
        </div>
        <div class="hotel-info">
          <span class="icon">📧</span>
          <a href="mailto:${h.email}">${h.email}</a>
        </div>
        ${h.website ? `
        <div class="hotel-info">
          <span class="icon">🌐</span>
          <a href="${h.website}" target="_blank">Sito web</a>
        </div>
        ` : ''}
        <div class="hotel-info">
          <span class="icon">🚶</span>
          <span>${h.distance}</span>
        </div>
        ${h.discount_code ? `
        <div class="discount-badge">
          <div class="code">${h.discount_code}</div>
          <div class="percent">Sconto ${h.discount_percent}% per i partecipanti</div>
        </div>
        ` : ''}
      </div>
    </div>
  `).join('');
});
</script>

</body>
</html>
