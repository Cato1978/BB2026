<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Gara Template</title>
  <link rel="icon" href="/favicon.ico">
  <script src="/config-loader.js"></script>
  <style>
    :root { --primary-color: #F7AF40; --bg-dark: #111; --text-light: #f0f0f0; --error-color: #EF4444; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-dark); color: var(--text-light); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    
    .login-container { background: #1a1a1a; padding: 2.5rem; border-radius: 12px; border: 1px solid #333; width: 100%; max-width: 400px; margin: 1rem; }
    .login-container h1 { color: var(--primary-color); text-align: center; margin-bottom: 0.5rem; }
    .login-container .subtitle { color: #888; text-align: center; margin-bottom: 2rem; }
    
    .form-group { margin-bottom: 1.5rem; }
    label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: #ccc; }
    input { width: 100%; padding: 0.8rem; border: 1px solid #444; border-radius: 6px; background: #222; color: var(--text-light); font-size: 1rem; }
    input:focus { outline: none; border-color: var(--primary-color); }
    
    .btn { padding: 1rem 2rem; font-size: 1rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; width: 100%; background: var(--primary-color); color: #000; }
    .btn:hover { opacity: 0.9; }
    
    .error { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--error-color); color: var(--error-color); padding: 0.8rem; border-radius: 6px; margin-bottom: 1rem; text-align: center; display: none; }
    
    .back-link { display: block; text-align: center; margin-top: 1.5rem; color: #888; text-decoration: none; }
    .back-link:hover { color: var(--primary-color); }
  </style>
</head>
<body>

<div class="login-container">
  <h1>🔐 Admin</h1>
  <p class="subtitle" data-config="event.fullName">Gara Template</p>
  
  <div class="error" id="error-msg"></div>
  
  <form id="login-form">
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" name="username" required autocomplete="username">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn">Accedi</button>
  </form>
  
  <a href="/" class="back-link">← Torna al sito</a>
</div>

<script>
document.addEventListener('configLoaded', () => {
  const cfg = window.GARA_CONFIG;
  document.title = `Login Admin - ${cfg.event.fullName}`;
});

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('error-msg');
  
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    
    if (res.ok) {
      window.location.href = '/admin.html';
    } else {
      const data = await res.json();
      errorEl.textContent = data.error || 'Credenziali non valide';
      errorEl.style.display = 'block';
    }
  } catch (err) {
    errorEl.textContent = 'Errore di connessione';
    errorEl.style.display = 'block';
  }
});
</script>

</body>
</html>
